name: Tests

# Runs the Pester suite on Linux in mock mode (no Fastmail token needed).
#
# `pester` publishes a context meant to be REQUIRED on main (cms-platform#437
# declares it in repo-settings' fleet.yml), so a pull_request run of this job
# must exist on every PR — a workflow-level `paths:` filter here would leave
# the required context missing on a PR that doesn't touch a salient path,
# and GitHub blocks a merge on a MISSING required check rather than treating
# it as passed. So the filter lives INSIDE the job instead: step `salient`
# below decides whether anything salient changed, and every later step is
# gated on its output — the job still runs and reports success either way.
# `push` to main keeps the cheap workflow-level `paths:` filter, because a
# push to main gates no merge and skipping the job entirely costs nothing.
# SALIENT_PATHS (in the `salient` step below) must stay equal to the
# `push.paths` list here. Keep this job free of `name:`, a matrix,
# `concurrency` and `timeout-minutes` — any of those can rename the
# published context or end a run `cancelled`, and a cancelled required
# context blocks a merge non-deterministically (see cms-platform's
# `docs/CI-INVARIANTS.md`, "A cancelled required check blocks the merge").

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "mocks/**"
      # Any workflow change runs the suite — see the same note in
      # repo-settings: a Dependabot action-SHA bump to a workflow file outside
      # this list produced zero check-runs, and the unattended-merge sweep in
      # dependabot-auto-merge.yml will not merge on zero signal.
      - ".github/workflows/**"
      - ".github/scripts/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Did this pull request touch a salient path?
        id: salient
        env:
          EVENT_NAME: ${{ github.event_name }}
          SALIENT_PATHS: |
            scripts/**
            tests/**
            mocks/**
            .github/workflows/**
            .github/scripts/**
        run: |
          set -euo pipefail

          while IFS= read -r entry; do
            if [ -z "$entry" ]; then
              continue
            fi
            case "$entry" in
              *"/**")
                prefix="${entry%/**}"
                if [ -z "$prefix" ]; then
                  echo "::error::SALIENT_PATHS entry '${entry}' is not a valid exact path or <prefix>/** glob"
                  exit 1
                fi
                case "$prefix" in
                  *'*'*)
                    echo "::error::SALIENT_PATHS entry '${entry}' is not a valid exact path or <prefix>/** glob"
                    exit 1
                    ;;
                esac
                ;;
              *'*'*)
                echo "::error::SALIENT_PATHS entry '${entry}' is not a valid exact path or <prefix>/** glob"
                exit 1
                ;;
            esac
          done <<<"$SALIENT_PATHS"

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "not a pull_request event (event=${EVENT_NAME}); running the suite unconditionally"
            exit 0
          fi

          # The pull_request checkout is GitHub's synthetic merge commit; its
          # first parent is the base branch tip, so diffing against HEAD^1
          # gives exactly the files this PR changes.
          if ! changed=$(git diff --name-only HEAD^1 HEAD 2>&1); then
            first_line=$(printf '%s\n' "$changed" | head -n1)
            echo "::warning::could not diff the merge commit against its base (${first_line}); running the suite unconditionally"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run=false
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            while IFS= read -r entry; do
              if [ -z "$entry" ]; then
                continue
              fi
              case "$entry" in
                *"/**")
                  prefix="${entry%/**}"
                  case "$file" in
                    "${prefix}"/*)
                      run=true
                      ;;
                  esac
                  ;;
                *)
                  if [ "$file" = "$entry" ]; then
                    run=true
                  fi
                  ;;
              esac
            done <<<"$SALIENT_PATHS"
          done <<<"$changed"

          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "salient change check: run=${run}"

      - name: Verify action lockfile
        if: steps.salient.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ext="$RUNNER_TEMP/gh-actions-lock"
          mkdir -p "$ext"
          gh release download v0.2.0 -R github/gh-actions-lock -p linux-amd64 -O "$ext/gh-actions-lock"
          echo "79ec84c191667fd935a277e6fd3662cf5d3669cccc9e99998731d8f306f373b6  $ext/gh-actions-lock" | sha256sum -c -
          chmod +x "$ext/gh-actions-lock"
          (cd "$ext" && gh extension install .)
          rc=0
          out=$(gh actions-lock --verify --no-interactive --json=valid,findings) || rc=$?
          # v0.2.0 exits 0 with a reachability-unknown finding when the API fails; fail on any finding
          # except cooldown-config-ignored, which reports dependabot.yml's cooldown exclude, not a pin.
          if [[ "$rc" -ne 0 ]] || ! jq -e '.valid == true and ([.findings[] | select(.category != "cooldown-config-ignored")] | length) == 0' <<<"$out" >/dev/null; then
            # Escape %, CR and LF so finding text cannot start a new workflow command.
            if jq -e 'type == "object"' <<<"$out" >/dev/null 2>&1; then
              jq -r 'def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A"); .findings[]? | select(.category != "cooldown-config-ignored") | "::error::actions.lock \(.category | esc): \(.dependency // .workflow // "-" | esc): \(.detail | esc)"' <<<"$out"
            else
              echo '::error::gh actions-lock --verify returned no readable JSON.'
            fi
            if jq -e 'any(.findings[]?; .category == "reachability-unknown")' <<<"$out" >/dev/null 2>&1; then
              echo '::error::reachability-unknown means the GitHub API was unreachable; re-run once it is back.'
            fi
            echo "::error::gh actions-lock --verify failed (exit $rc)."
            exit 1
          fi

      # act-only: the default act runner image has no pwsh; GitHub-hosted
      # ubuntu-latest already does, so this is skipped on real runs.
      - name: Ensure PowerShell (act only)
        if: ${{ steps.salient.outputs.run == 'true' && env.ACT == 'true' }}
        shell: bash
        run: |
          command -v pwsh >/dev/null 2>&1 && exit 0
          . /etc/os-release
          wget -q "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -O /tmp/pmc.deb
          sudo dpkg -i /tmp/pmc.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell

      - name: Install Pester
        if: steps.salient.outputs.run == 'true'
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck
          (Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1).Version.ToString()

      # WorkflowPins.Tests.ps1 parses workflow YAML; Pester has no YAML parser.
      - name: Install powershell-yaml
        if: steps.salient.outputs.run == 'true'
        shell: pwsh
        run: |
          Install-Module -Name powershell-yaml -RequiredVersion 0.4.12 -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop

      - name: Run Pester (mock mode)
        if: steps.salient.outputs.run == 'true'
        shell: pwsh
        env:
          FASTMAIL_MOCK_DIR: ${{ github.workspace }}/mocks
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $cfg

      - name: Upload test results
        if: always() && steps.salient.outputs.run == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pester-results
          path: testResults.xml

      - name: No salient path changed
        if: steps.salient.outputs.run != 'true'
        run: echo "::notice::No salient path changed — Pester suite skipped; reporting success so the required 'pester' context is present."
